    url: overlays/optoro-catalogs-overlay.yaml
  tags_raw:
  - returns-management
  - retail
  - inventory
  - product-data
- name: Optoro Facilities API
  description: Create or update the stores and warehouses in a retailer’s returns network so units can be received, dispositioned
    and moved against a known location. Single upsert operation, version 2024-08-08, OAuth 2.0 client credentials.
  humanURL: https://developer.optoro.com/openapi/facilities/openapi
  baseURL: https://facilities.optiturn.com
  tags:
  - Returns Management
  - Supply Chain
  - Retail
  properties:
  - type: OpenAPI
    url: openapi/optoro-facilities-openapi.yml
  - type: Overlay
    url: overlays/optoro-facilities-overlay.yaml
  tags_raw:
  - returns-management
  - supply-chain
  - retail
- name: Optoro RTV Vendor API
  description: Return-to-vendor agreements. POST /vendor_updates creates or updates a vendor and the policy terms that
    govern which returned units are routed back to that vendor rather than resold, refurbished or liquidated. Version
    2.0.0.
  humanURL: https://developer.optoro.com/openapi/rtv/openapi
  baseURL: https://rtv.optiturn.com
  tags:
  - Reverse Logistics
