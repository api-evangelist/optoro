- name: Optoro Auth API
  description: OAuth 2.0 client-credentials token endpoint for every Optoro API. Exchanges the client_id and client_secret
    issued by Optoro's Client Success team for a bearer access token valid 25 hours (90000 seconds) with scope "read
    write". The same token is accepted across all Optoro APIs.
  humanURL: https://developer.optoro.com/openapi/auth/openapi
  baseURL: https://auth.optiturn.com
  tags:
  - Authentication
