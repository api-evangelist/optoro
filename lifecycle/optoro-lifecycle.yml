deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  practice: >-
    Optoro has no written deprecation or sunset policy, and neither RFC 8594 `Sunset` nor the `Deprecation`
    header appears in any of the 17 definitions. What Optoro DOES do is mark superseded surfaces in-spec and
    keep prior versions of every API published on the developer portal side-by-side with the current one, so
    an integrator can diff. The one explicitly retired API is Forward Orders, whose title is
    "Forward Orders (DEPRECATED)" and whose single operation carries `deprecated: true` in the OpenAPI.
  evidence:
  - openapi/optoro-forward-orders-openapi.yml
  - https://developer.optoro.com/openapi/forward_orders/openapi
