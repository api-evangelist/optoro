    url: overlays/optoro-asn-overlay.yaml
  tags_raw:
  - reverse-logistics
  - supply-chain
  - fulfillment
  - inventory
- name: Optoro External Bin Changes API
  description: Unified external API for unit and location bin changes inside an Optoro warehouse. The only Optoro surface
    publishing both a write and a read-back operation (createExternalBinChange / showExternalBinChange), scoped write:external_bin_changes
    and read:external_bin_changes. Version 2023-05-01 r1.
  humanURL: https://developer.optoro.com/openapi/external_bin_changes/openapi
  baseURL: https://optiturn.com
  tags:
