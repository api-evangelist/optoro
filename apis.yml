- name: Optoro Catalogs API
  description: Product master data feed. POST /catalog_entry_updates upserts a catalog entry — SKU, title, imagery, GS1
    UPC/ASIN product identifiers, allowed and disallowed resale channels, and configurable custom fields — which Optoro
    then uses to disposition, route and price returned units. Version 2023-08-01.
  humanURL: https://developer.optoro.com/openapi/catalogs/openapi
  baseURL: https://catalogs.optiturn.com
  tags:
  - Returns Management
  - Retail
  - Inventory
  - Product Data
  properties:
  - type: OpenAPI
    url: openapi/optoro-catalogs-openapi.yml
  - type: Documentation
    url: https://developer.optoro.com/content/rm_integration_guide
