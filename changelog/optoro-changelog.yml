- api: Catalogs
  version: '2023-08-01'
  date: '2023-08-01'
  date_source: version string
  spec: openapi/optoro-catalogs-openapi.yml
  url: https://developer.optoro.com/openapi/catalogs/openapi
  breaking: true
  changes:
  - type: FEATURE
    text: >-
      The catalog_entry_updates endpoint now accepts a product_identifiers field. UPCs no longer have length
      validations; multiple ASINs can be associated with the same catalog entry; UPCs can now be associated
      with multiple catalog entries; update behavior can be specified as either append or replace.
  - type: BREAKING
    text: The upc, upcs, and asin fields are no longer accepted by the catalog_entry_updates endpoint.
  - type: BREAKING
    text: allowed_channels and disallowed_channels are truly mutually exclusive on the catalog_entry_updates endpoint.
  supersedes: '2018-05-10'
