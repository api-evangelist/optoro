- name: Optoro Drop Ship API
  description: Fulfil orders directly from returned and excess units and lots held in the Optoro RMS. Twelve operations
    across listings (index, show, update quantity), orders (index, show, create, batch create, update, cancel) and shipments
    (index, show, show-by-order). Cancellation is available only while an order is in pending_payment. Version 6.0, OAuth
    2.0 client credentials, page/per_page pagination.
  humanURL: https://developer.optoro.com/openapi/drop_ship/openapi
  baseURL: https://drop-ship.optiturn.com
  tags:
