  - Vendor Management
  properties:
  - type: OpenAPI
    url: openapi/optoro-rtv-openapi.yml
  - type: Overlay
    url: overlays/optoro-rtv-overlay.yaml
  tags_raw:
  - reverse-logistics
  - supply-chain
  - vendor-management
- name: Optoro Inbound ASN API
  description: Advance shipping notices for returns and stock moving into an Optoro facility. POST /asns creates an ASN
    carrying carrier, tracking number, ship date, origin and destination plus cartons and their line details (SKU, UPC,
    ASIN, condition, quantity, return reason, unit identifier); PUT /asns/{asn-number} amends it by natural key.
  humanURL: https://developer.optoro.com/openapi/asn/openapi
  baseURL: https://asn.optiturn.com
  tags:
