                  bonus_credit_amount_cents: 0
                  receiving_complete: false
                  gift_refund_only: false
                  giftee_email: testemail@domain.com
                  warehouse_id: '1'
                  vendor: modrno
                  concept: concept
                  customer:
                    tags:
                      - gold_tier_member
      responses:
        '200':
          description: Success
components:
  schemas:
    rma_item:
      required:
        - order_line_item_identifier
        - order_identifier
        - refund_financials
        - refund_type
        - return_reason
        - sku
        - upc
      type: object
      properties:
        order_line_item_identifier:
          description: The item's identifier in the order.
          type: string
          example: '1'
        order_identifier:
          description: Public facing identifier for the order.
          type: string
          example: O9876
        secondary_identifier:
          description: >-
            OMS or backend system identifier for the original order.  Used when
            ecommerce and fulfillment platforms have unique identifiers.
          type: string
          example: STVMD0123
        exchange_order_identifier:
          description: >-
            The identifier of the exchange order. Used when the item being
            returned was chosen to be exchanged.
          type: string
          example: ''
        original_order_identifier:
          description: >-
            Only populated when returning an exchange item. Refers back to the
            order that was exchanged.
          type: string
          example: ''
        return_reason:
          description: The shopper chosen reason for returning the item.
          type: string
          example: Too Small
        is_exchange:
          type: boolean
          description: Indicates whether the RMA item belongs to an exchange order
          example: false
        sku:
          description: Unique product identifier of item.
          type: string
          example: Sku1234
        upc:
          description: Unique product code of item.
          type: string
          example: '00123456789012'
        tracking_number:
          description: Tracking number of the package the item is located in.
          type: string
          example: 1Z938174729103
        package_tracking_status:
          description: >-
            The status of the package that the RMA item is in. For Express
            Returns, ACCEPTED is when item has been accepted at a dropoff
            location. However, NOT_DROPPED_OFF is when item has not been dropped
            off in a partially accepted RMA. For Home Pickups, ACCEPTED is when
            the item has been picked up by a pickup provider. Upon carrier scan
            a package status can be moved to TRANSIT
          type: string
          enum:
            - null
            - PRE_TRANSIT
            - ACCEPTED
            - TRANSIT
            - DELIVERED
            - RETURNED
            - FAILURE
            - NOT_DROPPED_OFF
        receiving_status:
          description: >-
            The item's receiving status.  Only populated when using Optoro's
            Returns Management.
          type: string
          enum:
            - PENDING
            - RECEIVED
            - NOT_RECEIVED
        refund_financials:
          required:
            - estimated_refund_amount_cents
            - optoro_refund_amount_cents
            - shopper_refund_amount_cents
          type: object
          description: >-
            RMA item financial information used for calculating the refund
            amount.
          properties:
            estimated_refund_amount_cents:
              description: Total possible refund amount based on goods returned.
              type: integer
              example: 100
            optoro_refund_amount_cents:
              description: Amount Optoro will be paid based on instant exchange usage.
              type: integer
              example: 0
            shopper_refund_amount_cents:
              description: >-
                Estimated amount the shopper will be refunded based on instant
                exchange usage.
              type: integer
              example: 100
        refund_type:
          description: The refund type for the item.
          type: string
          enum:
            - REFUND
            - STANDARD_EXCHANGE
            - INSTANT_EXCHANGE
            - INSTANT_STORE_CREDIT
        warehouse_receipt_condition:
          description: The condition of the item when it was received at the warehouse.
          type: string
          example: 'N'
    rma:
      type: object
      required:
        - rma_identifier
        - created_at
        - items
        - status
        - return_shipping_cost_cents
        - bonus_credit_amount_cents
        - return_method
        - gift_refund_only
      properties:
        rma_identifier:
          description: Identifier of the RMA.
          type: string
          example: RMA123
        status:
          description: The status of the RMA.
          type: string
          enum:
            - PENDING_EXCHANGE
            - CREATED
            - REFUNDED
            - PARTIAL_REFUND
            - CANCELED
        created_at:
          description: Creation date in ISO 8601 format, UTC.
          type: string
          example: '2018-08-30T15:39:42.025Z'
        updated_at:
          description: Last updated date in ISO 8601 format, UTC.
          type: string
          example: '2018-08-30T15:39:42.025Z'
        items:
          description: List of items that are being returned in the RMA.
          type: array
          items:
            $ref: '#/components/schemas/rma_item'
        return_method:
          description: Return method used to return the RMA.
          type: string
          enum:
            - mail-back
            - express-returns
            - customer-keep
            - home-pickup
          example: mail-back
        return_shipping_cost_cents:
          description: The return shipping cost.
          type: integer
          example: 100
        bonus_credit_amount_cents:
          description: The bonus credit granted to the shopper.
          type: integer
          example: 500
        gift_refund_only:
          description: >-
            If true, only issue a gift card and do not refund original purchase
            payment.
          type: boolean
          example: true
        giftee_email:
          description: Email to send gift card when gift_refund_only is true
          type: string
          example: giftee@example.com
        warehouse_id:
          description: >-
            Warehouse that return goods will be shipped to when using dynamic
            package routing
          type: string
          example: ''
        receiving_complete:
          description: This is for RM only.
          type: boolean
          example: false
        concept:
          description: RMA portal identifier
          type: string
          example: concept_!
        vendor:
          description: >-
            Vendor name from third party tag. Only present if any of the
            products of the corresponding order has this type of tag.
          type: string
          example: modrno
        customer:
          description: Customer details
          type: object
          properties:
            tags:
              description: List of customer tags from the order associated with this RMA.
              type: array
              items:
                type: string
              example:
                - some-customer-tag
                - SilverTier
