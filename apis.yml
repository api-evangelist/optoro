aid: optoro
name: Optoro
description: 'Optoro is a returns management and reverse-logistics software company (Washington, DC; acquired by Blue
  Yonder in August 2025) whose OptiTurn platform powers the full returns lifecycle for retailers, brands and 3PLs — a
  shopper-facing returns portal and RMA workflow, in-store and warehouse returns processing, disposition and routing
  decisions, drop-ship fulfillment of returned and excess inventory, return-to-vendor agreements, and resale across secondary
  channels. Optoro publishes a public, API-first developer portal at developer.optoro.com covering seventeen OpenAPI
  3.0/3.1 definitions across two directions: inbound APIs the retailer calls (Catalogs, Facilities, Drop Ship, RTV Vendor,
  ASN, External Bin Changes, Auth) and outbound webhooks/customer endpoints Optoro calls (RMAs, Disposition Update, Final
  Disposition, Outbound ASN, Exchange Orders, Exchange Variants, Drop Ship confirmation/cancellation). Authentication
  is OAuth 2.0 client credentials against auth.optiturn.com with 25-hour bearer tokens, and a full sandbox estate is
  published on *.sandbox.optiturn.com.'
url: https://raw.githubusercontent.com/api-evangelist/optoro/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
