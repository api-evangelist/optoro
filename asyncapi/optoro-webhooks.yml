customer_endpoints:
- name: Exchange Orders
  kind: customer-endpoint
  direction: optoro-to-customer
  method: POST
  operation_id: exchange_orders
  spec: openapi/optoro-exchange-orders-openapi.yml
  version_header: 'X-Optiturn-Api-Version: 1 | 2'
  url: https://developer.optoro.com/openapi/exchange_orders/openapi
  idempotency_key: original_order_id
  contract: >-
    "Your endpoint should handle all tax and shipping calculations. The endpoint should be idempotent, using
    original_order_id as the key. Only one exchange order can be placed against an original_order_id."
