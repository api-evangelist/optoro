- name: Optoro Returns Portal Orders API
  description: Retailers POST a full snapshot of each order — order, items, customer, refunds, discounts — to Optoro
    at the first shipped event and again on every lifecycle change, which is what the shopper sees when initiating a
    return in the Optoro returns portal. Version 3.0.0.
  humanURL: https://developer.optoro.com/openapi/returns_portal_orders/openapi
  baseURL: https://orders.optiturn.com
