domain_standards:
- id: gs1-upc-gtin
  name: GS1 UPC / GTIN product identification
  conforms: true
  strength: identifier-vocabulary
  evidence: >-
    The Catalogs API (2023-08-01) models product identity as `product_identifiers.items[].type`, an enum of
    `upc` | `asin` | `generic`, and documents `upc` as "Universal Product Code. A barcode number that is
    usually 8, 12, 13, or 14 characters" — i.e. GTIN-8/12/13/14. The published request example carries
    `{"value": "012345678905", "type": "upc"}`, a valid UPC-A. openapi/optoro-catalogs-openapi.yml lines
    ~240-280 and ~749-754.
  note: >-
    This is an identifier-scheme adoption expressed in the contract, not a protocol-level standard signature
    of the kind the rubric enumerates (SCIM URN, OData $metadata, OpenRTB endpoint, Sparkplug namespace).
    Recorded because it is the one genuine cross-vendor interoperability vocabulary Optoro's contract
    declares; do not over-read it.
- id: ansi-x12-856-asn
  name: ANSI ASC X12 856 Advance Ship Notice
  conforms: false
  evidence: >-
    Optoro's Inbound ASN and Outbound ASN APIs use the ASN concept and vocabulary (asn-number, carrier,
    shipment, tracking) but expose it as bespoke JSON over HTTPS. No X12, EDIFACT, or GS1 EPCIS segment,
    envelope or message-type reference appears in any of the 17 definitions. A retailer already speaking
    EDI 856 needs a bilateral connector.
- id: gs1-epcis
  name: GS1 EPCIS
  conforms: false
  evidence: No EPCIS event vocabulary (bizStep, disposition URNs) — Optoro's `disposition` is a proprietary enum
- id: odata
  name: OData
  conforms: false
  evidence: No $metadata endpoint or OData query options
- id: scim
  name: SCIM 2.0
  conforms: false
  evidence: No SCIM schema URN; Optoro publishes no user-provisioning API
