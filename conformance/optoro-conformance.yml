    optoro-drop-ship-openapi.yml, optoro-facilities-openapi.yml and optoro-rtv-openapi.yml. The API
    Overview documents the RFC 6749 client-credentials grant end to end with a live request/response example.
- id: oauth2-client-credentials
  name: OAuth 2.0 Client Credentials Grant (RFC 6749 §4.4)
  conforms: true
  evidence: 'POST /oauth/token with grant_type=client_credentials, client_id, client_secret; response carries
