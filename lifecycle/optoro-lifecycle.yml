breaking_change_signalling:
  method: in-spec changelog sections marked BREAKING
  examples:
  - 'Catalogs 2023-08-01: BREAKING — the `upc`, `upcs`, and `asin` fields are no longer accepted by the
    catalog_entry_updates endpoint'
  - 'Catalogs 2023-08-01: BREAKING — `allowed_channels` and `disallowed_channels` are truly mutually exclusive'
  - 'RMAs v4: BREAKING — the `UNEVEN_GC` item refund type value is renamed to `INSTANT_STORE_CREDIT`'
  see: changelog/optoro-changelog.yml
