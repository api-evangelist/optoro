note: >-
  Optoro publishes a single global rate-limit policy in the API Overview that applies to all inbound APIs.
  It is stated as a reserved right ("Optoro reserves the right to rate limit in the event that a high volume
  of traffic threatens our system") rather than a hard contractual quota. No RateLimit-* / X-RateLimit-*
  response headers and no Retry-After header are documented; the only runtime signal an agent gets is the
  HTTP 429 status code itself, and the documented remedy is client-side exponential backoff.
