- name: Optoro Event Webhooks and Customer Endpoints
  description: 'Ten Optoro-to-customer message contracts published as OpenAPI: the RMAs webhook (return initiated, tracking
    issued, carrier scan, drop-off, warehouse receipt, refund posted), Disposition Update, Final Disposition, Outbound
    ASN, and Drop Shipment confirmation / cancellation / partial cancellation; plus three ''customer endpoints'' whose
    response Optoro acts on — Exchange Orders (idempotent on original_order_id), Exchange Variants, and the deprecated
    Forward Orders. Delivery is at-least-once and unordered, retried with exponential backoff for up to 32 hours, retained
    30 days. servers[] names developer.optoro.com as a documentation placeholder because the real target URL is the integrator''s
    own host.'
  humanURL: https://developer.optoro.com/content/webhooks
  baseURL: https://developer.optoro.com
