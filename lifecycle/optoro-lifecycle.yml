versioning:
  scheme: mixed
  detail: >-
    Three coexisting schemes. (1) An HTTP header, `X-Optiturn-Api-Version`, whose accepted values are
    enumerated per API in that API's spec — the API Overview says "Some APIs are versioned using an HTTP
    header. The header name and value will vary by API, so check the relevant API specification."
    (2) Date-stamped versions for the data APIs (Catalogs 2018-05-10 -> 2023-08-01; External Bin Changes
    2022-10-12 -> 2023-05-01; Facilities 2024-08-08). (3) Integer/semver majors for the event APIs
    (RMAs 3 -> 4 -> 5; Exchange Orders 1 -> 2; Drop Ship 2023-08-15 -> 6.0).
  header: X-Optiturn-Api-Version
  current:
    rmas: '5.0.0'
    drop_ship: '6.0'
    catalogs: '2023-08-01'
    facilities: '2024-08-08'
    external_bin_changes: '2023-05-01 r1'
    exchange_orders: '2.0.0'
    returns_portal_orders: '3.0.0'
    asn: '1.0.0'
  docs: https://developer.optoro.com/content/api_overview
