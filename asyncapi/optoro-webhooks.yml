asyncapi_published: false
asyncapi_note: >-
  Optoro publishes NO AsyncAPI document. It documents its event surface as OpenAPI POST operations against an
  endpoint the CUSTOMER hosts — nine of the seventeen published definitions describe Optoro-to-customer
  messages rather than customer-to-Optoro calls, with servers[] pointing at developer.optoro.com as a
  documentation placeholder because the real target URL is supplied by the integrator. No AsyncAPI file was
  fabricated here; this artifact is the webhook catalog Optoro actually publishes.
delivery:
  guarantee: at-least-once
  ordering: not guaranteed — delivery is parallelized; most messages carry a timestamp for reordering
  duplicates: expected — "your webhook must be able to handle them"
  latency: asynchronous, not real time
  transport: HTTPS POST, TLS 1.2 minimum, certificate must be signed by a globally trusted CA with intermediates installed
  content_type: application/json
  method: POST
  success_criteria: any 2xx (200 OK recommended)
  retry:
    window: up to 32 hours
    strategy: exponential backoff
    retriable_status_codes: [500, 502, 503, 504]
    also_retried: connection timeouts
    reauth_on: 401 — Optoro re-authenticates and retries
    do_not_return: 400 / 422 — "quietly ignore the message and respond with a 200 OK"
  retention: 30 days; replay outside the 32-hour window requires Optoro Client Success
  configuration: >-
    Webhooks are configured by Optoro's Client Success team, not self-serve. Required from the integrator:
    the list of webhooks to enable, a URL for each, and authentication details.
  authentication_supported:
  - Basic Auth
  - OAuth 2
  - AWS SigV4
  - API key in an HTTP header
  credential_handling: secrets sent to Client Success as encrypted files and stored encrypted
surface_kinds:
- kind: webhook
  definition: Called when an event occurs in Optoro's system ("telling"). Response only acknowledges receipt; Optoro does not act on the body.
- kind: customer-endpoint
  definition: Called when Optoro needs information ("asking"). The response body influences Optoro's behaviour.
webhooks:
- name: RMAs
  kind: webhook
  direction: optoro-to-customer
  method: POST
  operation_id: rmas
  spec: openapi/optoro-rmas-openapi.yml
  version: 5.0.0
  version_header: 'X-Optiturn-Api-Version: 3'
  url: https://developer.optoro.com/openapi/rmas/openapi
  events:
  - shopper initiates a return
  - carrier tracking details provided
  - carrier receives and scans the return
  - shopper drops off the return, or a pick-up partner collects it
  - item received and ready for refund (Returns Management customers)
  - retailer posts refund details in the Refunds object of the Returns Portal Orders API
