openapi: 3.1.0
info:
  title: RMAs
  description: >
    ## Introduction


    When an RMA event occurs in the returns portal, Optoro will notify your
    webhook about the RMA and its details.

    These events can be at the time your customer has created an RMA or when the
    RMA has been shipped.


    Optoro's system will make an HTTP POST request to the API endpoint at the
    configured URL.

    The API endpoint will need to return an HTTP 200-299 status for a webhook to
    be considered successful.


    See the [Webhook Message
    Behaviors](../../../content/webhooks/#message-behaviors) for more details
    about aspects to consider regarding message delivery.


    ## When it is used


    - Optoro posts an **RMAs** message to you when the shopper initiates a
    return.

    - Optoro posts an **RMAs** message to you when carrier tracking details are
    provided (when applicable).

    - Optoro posts an **RMAs** message to you when the carrier receives and
    scans the return.

    - Optoro posts an **RMAs** message when the shopper drops off the return at
    a drop-off location or when a pick-up partner picks up the return from the
    shopper.

    - Optoro posts an **RMAs** message when the item is received (and ready for
    refund) when you also use Optoro’s Returns Management solution.

    - Optoro posts an **RMAs** message to you after you update the order with
    refund details in the Refunds object of the **Returns Portal Order** API.


    ## Changelog


    ### Version 5


    * FEATURE: The `warehouse_receipt_condition` item field is added to the RMA
    item object.

    * FEATURE: `NOT_DROPPED_OFF` is a new option for item's
    `package_tracking_status` (applicable for items in a partially accepted RMA
    that were not dropped off).
  version: 5.0.0
paths:
  /rmas:
    post:
      summary: RMA Event
      operationId: rmas
      parameters:
        - in: header
          name: X-Optiturn-Id
          schema:
            type: string
          required: true
          example: Modrno
        - in: header
          name: X-Optiturn-Api-Version
          schema:
            type: string
            enum:
              - 3
          required: true
      requestBody:
        description: >
          The RMA webhook provides details of the return as it progresses
          through the various lifecycle events.


          On the right you will find example payloads listed that correspond to
          a specific type of the return.  These are not inclusive of events that
          could happen on the RMA such as a warehouse receipt or tracking event.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/rma'
            examples:
              basic_rma:
                summary: Created RMA for a Refund
                description: >-
                  A shopper created an RMA and selected all items to be refunded
                  to the shopper's original form of payment.
                value:
                  rma_identifier: rma1234
                  status: CREATED
                  created_at: '2018-08-30T15:39:42.025Z'
                  updated_at: '2018-08-30T15:39:42.025Z'
                  items:
                    - order_line_item_identifier: '1'
                      order_identifier: o12345
                      secondary_identifier: soi12345
                      exchange_order_identifier: eoid23456
                      original_order_identifier: ooid3456
                      return_reason: Too Small
                      is_exchange: true
                      sku: Sku1234
                      upc: UPC1234
                      tracking_number: 1Z403818413131
                      package_tracking_status: PRE_TRANSIT
                      receiving_status: PENDING
                      refund_financials:
                        estimated_refund_amount_cents: 1000
                        optoro_refund_amount_cents: 0
                        shopper_refund_amount_cents: 1000
                      refund_type: REFUND
                      warehouse_receipt_condition: 'N'
                  return_method: mail-back
                  return_shipping_cost_cents: 100
                  bonus_credit_amount_cents: 0
                  receiving_complete: false
                  gift_refund_only: false
                  giftee_email: testemail@domain.com
                  warehouse_id: '1'
                  vendor: modrno
                  concept: concept
                  customer:
                    tags:
                      - gold_tier_member
              refunded_rma:
                summary: Refunded RMA
                description: >
                  An RMA moves to Refunded when any of the following are true.

                  1. When all items in the RMA have a refund type of REFUND and
                  Optoro has received refunds on the original order for all
                  items in the RMA.

                  2. When all items in the RMA have a refund type of
                  INSTANT_EXCHANGE or STANDARD_EXCHANGE and Optoro has received
                  fulfillment of the exchange order for all exchange items in
                  the RMA.

                  3. When all items in the RMA have a refund type of
                  INSTANT_STORE_CREDIT and Optoro has successfully created the
                  exchange order for the instant gift card.

                  4. When the RMA includes items that have a refund type of
                  REFUND and (INSTANT_EXCHANGE or STANDARD_EXCHANGE) and both
                  scenario #1 and #2 conditions are met.

                  5. When the RMA includes items that have a refund type of
                  INSTANT_EXCHANGE and INSTANT_STORE_CREDIT and both scenario #2
                  and #3 conditions are met.
