source: >-
  In-spec "Changelog" / "Change Log" sections in info.description of the published OpenAPI definitions on
  https://developer.optoro.com, plus the older versions Optoro keeps published side by side
docs: https://developer.optoro.com/openapi/rmas/openapi
scheme: per-api
note: >-
  Optoro publishes no single site-wide dated changelog. Change history lives INSIDE each OpenAPI definition
  as a `## Changelog` / `## Change Log` section in info.description, and the superseded versions of each API
  stay published on the portal alongside the current one so an integrator can diff them. Entries are labelled
  FEATURE or BREAKING but carry NO dates — the only temporal anchor is the date-stamped version string on the
  data APIs (Catalogs 2023-08-01, Facilities 2024-08-08, External Bin Changes 2023-05-01). Recorded here
  verbatim from the specs; API Evangelist has added no dates of its own.
